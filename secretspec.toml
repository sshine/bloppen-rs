[project]
name = "bloppen-rs"
revision = "1.0"

# Credentials for Phase 4 live validation. Values come from whichever provider
# the developer configured; the global default in this environment is the
# keyring. Nothing secret belongs in this file.
#
# Populate them with `just secrets-set` (or `secretspec set NAME`), then run
# `just secrets-check`. `just probe` resolves them through `secretspec run`.
[profiles.default]
BORNELOPPEN_EMAIL = { description = "boerneloppen.dk account email", required = true }
BORNELOPPEN_PASSWORD = { description = "boerneloppen.dk account password", required = true }
BORNELOPPEN_TEST_WRITES = { description = "Set to opt into live probes that submit write forms", required = false }
