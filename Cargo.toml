[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/bloppen"
homepage = "https://github.com/sshine/bloppen"

[workspace.dependencies]
anyhow = "1.0"
cookie_store = "0.22"
reqwest = { version = "0.13", default-features = false }
reqwest_cookie_store = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
url = "2"
