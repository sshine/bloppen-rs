[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/bloppen-rs"
homepage = "https://github.com/sshine/bloppen-rs"

[workspace.dependencies]
bloppen-api = { version = "0.1.0", path = "crates/bloppen-api" }

anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false }
clap = "4.5.51"
cookie = "0.18"
cookie_store = "0.22"
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false }
reqwest_cookie_store = "0.10"
rmcp = "3.5.0"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
tokio = { version = "1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.20"
url = "2"
wiremock = "0.6.5"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
